$mainMod = SUPER

# Layout Mode & Minimap
bind = $mainMod, G, global, caelestia:layout
bind = $mainMod ALT, G, global, caelestia:layout
bind = $mainMod SHIFT, G, global, caelestia:layoutMap

# Directional Spatial Navigation
bind = $mainMod, up, global, caelestia:layoutNavUp
bind = $mainMod, down, global, caelestia:layoutNavDown
bind = $mainMod, left, global, caelestia:layoutNavLeft
bind = $mainMod, right, global, caelestia:layoutNavRight
bind = $mainMod ALT, up, global, caelestia:layoutNavUp
bind = $mainMod ALT, down, global, caelestia:layoutNavDown
bind = $mainMod ALT, left, global, caelestia:layoutNavLeft
bind = $mainMod ALT, right, global, caelestia:layoutNavRight

# Spatial Order Navigation
bind = $mainMod, Tab, global, caelestia:layoutCycleWindow
bind = $mainMod SHIFT, Tab, global, caelestia:layoutCycleWindowPrev
bind = ALT, Tab, global, caelestia:layoutCycleWindow
bind = ALT SHIFT, Tab, global, caelestia:layoutCycleWindowPrev

# Preselect Next Window Direction
bind = $mainMod SHIFT, up, global, caelestia:layoutSetDirUp
bind = $mainMod SHIFT, down, global, caelestia:layoutSetDirDown
bind = $mainMod SHIFT, left, global, caelestia:layoutSetDirLeft
bind = $mainMod SHIFT, right, global, caelestia:layoutSetDirRight
bind = $mainMod ALT, D, global, caelestia:layoutCycleDir

# Attach / Move Window in Direction
bind = $mainMod CTRL, up, global, caelestia:layoutAttachUp
bind = $mainMod CTRL, down, global, caelestia:layoutAttachDown
bind = $mainMod CTRL, left, global, caelestia:layoutAttachLeft
bind = $mainMod CTRL, right, global, caelestia:layoutAttachRight

# Sizing & Float Place
bind = $mainMod, F, global, caelestia:layoutToggleFull
bind = $mainMod ALT, F, global, caelestia:layoutToggleSlotFloat
bind = $mainMod SHIFT, F, fullscreen, 0

# PaperWM Column Width Adjustments
bind = $mainMod ALT, equal, global, caelestia:layoutPaperWiden
bind = $mainMod ALT, plus, global, caelestia:layoutPaperWiden
bind = $mainMod ALT, minus, global, caelestia:layoutPaperNarrow
bind = $mainMod ALT, bracketright, global, caelestia:layoutPaperWiden
bind = $mainMod ALT, bracketleft, global, caelestia:layoutPaperNarrow

# Reset Layout
bind = $mainMod ALT, BackSpace, global, caelestia:layoutReset
